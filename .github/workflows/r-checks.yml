name: R checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check project result tables
        run: |
          test -s results/project_summary.tsv
          test -s results/project_summary.md
          test -s results/predictive_signature.tsv
      - name: Parse R scripts
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          files <- list.files(c("code", "scripts"), pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          for (path in sort(files)) {
            parse(file = path)
            cat("Parsed", path, "\n")
          }
          RSCRIPT
