name: R checks

on:
  push:
    branches:
      - main
      - fix/reproducible-data-pipeline
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The checks below use tracked result tables and source text only.
          # Avoid downloading the large Git LFS research inputs in CI.
          lfs: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Check saved result tables
        run: Rscript scripts/check_results.R

      - name: Parse all R scripts
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          roots <- c("code", "scripts")
          files <- unlist(lapply(roots, function(root) {
            if (!dir.exists(root)) return(character())
            list.files(root, pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          }))
          if (!length(files)) stop("No R scripts found.")
          for (path in sort(files)) {
            parse(file = path)
            cat("Parsed", path, "\n")
          }
          RSCRIPT
